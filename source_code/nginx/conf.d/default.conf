# CoinGecko API response cache
proxy_cache_path /tmp/coingecko_cache levels=1:2 keys_zone=coingecko:10m max_size=100m inactive=10m;

# ====================================================================
# SERVER BLOK 1: PORT 80 (HTTP)
# Fungsi: 
# 1. Melayani verifikasi Let's Encrypt ACME challenge
# 2. Redirect otomatis semua traffic HTTP lainnya ke HTTPS
# ====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name mycoinflips.com www.mycoinflips.com;
    server_tokens off;

    # Wajib untuk verifikasi sertifikat Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect otomatis ke HTTPS untuk URL lainnya
    location / {
        return 301 https://$host$request_uri;
    }
}

# ====================================================================
# SERVER BLOK 2: PORT 443 (HTTPS)
# Fungsi: Melayani website utama dan meneruskan API ke backend
# ====================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mycoinflips.com www.mycoinflips.com;
    server_tokens off;

    # Path Sertifikat SSL dari Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/mycoinflips.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mycoinflips.com/privkey.pem;
    
    # Konfigurasi keamanan SSL standar (opsional namun disarankan)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads up to 20MB (for deposit proof images)
    client_max_body_size 20m;

    # Vue Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.IO to backend
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploaded files to backend
    location /uploads/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    # Proxy CoinGecko API with caching
    location /coingecko/ {
        proxy_pass https://api.coingecko.com/api/v3/;
        proxy_http_version 1.1;
        proxy_set_header Host api.coingecko.com;
        proxy_set_header Accept "application/json";
        proxy_ssl_server_name on;

        proxy_cache coingecko;
        proxy_cache_valid 200 3m;
        proxy_cache_valid 429 1m;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
