# CoinGecko API response cache
proxy_cache_path /tmp/coingecko_cache levels=1:2 keys_zone=coingecko:10m max_size=100m inactive=10m;

server {
    listen 80;
    server_name mycoinflips.com www.mycoinflips.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mycoinflips.com www.mycoinflips.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mycoinflips.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mycoinflips.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache assets safely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vue Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.IO to backend
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploaded files to backend
    location /uploads/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    # Proxy CoinGecko API with caching to avoid rate limiting
    location /coingecko/ {
        proxy_pass https://api.coingecko.com/api/v3/;
        proxy_http_version 1.1;
        proxy_set_header Host api.coingecko.com;
        proxy_set_header Accept "application/json";
        proxy_ssl_server_name on;

        # Enable caching
        proxy_cache coingecko;
        proxy_cache_valid 200 3m;
        proxy_cache_valid 429 1m;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
