server {
    listen 80;
    listen [::]:80;

    server_name mycoinflips.com www.mycoinflips.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'HTTP Only Mode for Certbot';
        add_header Content-Type text/plain;
    }
}
